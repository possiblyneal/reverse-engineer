[package]
name = "braintellect-linux"
version = "0.0.0"
edition = "2021"
publish = false
description = "Rust reimplementation of the BRAINtellect2 neurofeedback app for Debian Linux, validated by parity against the real app."

[lib]
name = "braintellect_linux"
path = "src/lib.rs"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "x11", "wayland", "default_fonts"] }
libc = "0.2"
rusqlite = { version = "0.41.1", features = ["bundled"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
